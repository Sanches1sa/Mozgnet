# mozgnet: автосборка APK на GitHub. Каждый push в main (и запуск вручную:
# Actions → «mozgnet APK» → Run workflow) собирает APK и выкладывает его в
# Releases — ставь на телефон с github.com/<ты>/mozgnet/releases/latest.
name: mozgnet APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy собирает Python-часть приложения тем же Python, что в телефоне
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Сборка APK (с numpy для своей LLM)
        id: full
        continue-on-error: true
        run: gradle --no-daemon --stacktrace assembleRelease -Pmozgnet.numpy=true

      - name: Сборка APK без numpy (если numpy не собрался)
        if: steps.full.outcome != 'success'
        run: gradle --no-daemon --stacktrace assembleRelease -Pmozgnet.numpy=false

      - name: Имя файла
        id: name
        run: |
          VER=$(cat app/src/main/assets/cloud/VERSION | tr -d ' \r\n')
          NP=$([ "${{ steps.full.outcome }}" = "success" ] && echo "" || echo "-nonumpy")
          OUT="mozgnet-1.0.${{ github.run_number }}-cloud${VER}${NP}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: mozgnet-apk
          path: ${{ steps.name.outputs.file }}

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: mozgnet 1.0.${{ github.run_number }} (облако ${{ steps.name.outputs.ver }})
          make_latest: true
          files: ${{ steps.name.outputs.file }}
          body: |
            APK mozgnet — облако «Мозг-12» в телефоне, скан сети, платы.
            Установка: скачай APK на телефон и открой (разреши установку из этого источника).
            Новая версия ставится поверх старой — память облака в телефоне сохраняется.
