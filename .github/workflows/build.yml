# mozgnet — один репозиторий «Мозг-12»: приложение (app/), облако (cloud/),
# плата neuro_12 (board/), лаунчер (launcher/). Каждый push в main собирает
# ВСЁ и выкладывает в Releases:
#   mozgnet-….apk                         — приложение для телефона
#   neuro12-cloud-v…-update.zip          — обновление облака (панель → Обновление)
#   neuro_12-v….zip                       — приложение платы для App Lab
#   neuro12-all-v….zip                    — общий: облако (свой Python), плата, APK, install.exe
#   neuro12-start.exe                     — лаунчер Windows
#   neuro12-launcher-linux-v….zip         — лаунчер Linux (РЕД ОС, Ubuntu) с облаком
name: mozgnet

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Сборка APK (с numpy для своей LLM)
        id: full
        continue-on-error: true
        run: gradle --no-daemon --stacktrace assembleRelease -Pmozgnet.numpy=true
      - name: Сборка APK без numpy (если numpy не собрался)
        if: steps.full.outcome != 'success'
        run: gradle --no-daemon --stacktrace assembleRelease -Pmozgnet.numpy=false
      - name: Имя APK
        run: |
          VER=$(tr -d ' \r\n' < cloud/VERSION)
          NP=$([ "${{ steps.full.outcome }}" = "success" ] && echo "" || echo "-nonumpy")
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk "out/mozgnet-1.2.${{ github.run_number }}-cloud${VER}${NP}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: out/* }

  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Лаунчер Windows и Linux
        run: |
          cd launcher/app
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui" -o ../../out/neuro12-start.exe .
          mkdir -p ../bin
          for a in amd64 arm64; do GOOS=linux GOARCH=$a CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../bin/neuro12-start-linux-$a .; done
      - name: Облако, плата, пакет для Linux
        run: |
          CV=$(tr -d ' \r\n' < cloud/VERSION); BV=$(grep -oP 'APP_VERSION = "\K[^"]+' board/python/main.py)
          LV=$(grep -oP 'const VER = "\K[^"]+' launcher/app/main.go)
          mkdir -p out tmp/neuro12-cloud
          rsync -a --exclude data --exclude '__pycache__' --exclude '.pytest_cache' cloud/ tmp/neuro12-cloud/
          (cd tmp && zip -qr ../out/neuro12-cloud-v${CV//./_}-update.zip neuro12-cloud)
          (cd board && zip -qr ../out/neuro_12-v${BV//./_}.zip . -x '*__pycache__*' '*.ruff_cache*')
          L=tmp/neuro12-launcher-linux-v$LV; mkdir -p $L/src
          cp launcher/install-linux.sh launcher/uninstall-linux.sh launcher/README-linux.md launcher/README.md launcher/THIRD_PARTY_LICENSES.txt launcher/brain.png $L/
          cp -r launcher/bin $L/ && cp -r launcher/app launcher/installer $L/src/ && cp -r tmp/neuro12-cloud $L/neuro12-cloud
          (cd tmp && zip -qr ../out/neuro12-launcher-linux-v${LV//./_}.zip neuro12-launcher-linux-v$LV)
          echo "CV=$CV" >> $GITHUB_ENV; echo "BV=$BV" >> $GITHUB_ENV; echo "LV=$LV" >> $GITHUB_ENV
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: pc, path: out/* }

  windows:
    # ОБЩИЙ АРХИВ neuro12-all-v….zip: neuro12-cloud (облако со своим Python 3.12
    # + numpy + Pillow + vosk + русская модель Vosk, лаунчер), neuro12-app
    # (приложение платы), apk (телефон), install.exe. Python ставить не нужно;
    # лаунчер (⚙ → «Установка из ZIP-архива») сам раскладывает папки по местам.
    needs: [apk]
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run: { shell: pwsh }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: actions/download-artifact@v4
        with: { name: apk, path: pkg/apk }
      - name: Общий архив neuro12-all
        run: |
          $ErrorActionPreference = "Stop"
          $CV = (Get-Content cloud/VERSION -Raw).Trim()
          $P = "pkg"; $C = "$P/neuro12-cloud"
          New-Item -ItemType Directory -Force $C, "$C/launcher", out | Out-Null
          robocopy cloud $C /E /XD data __pycache__ .pytest_cache /NFL /NDL /NJH /NJS | Out-Null
          robocopy board "$P/neuro12-app" /E /XD __pycache__ .ruff_cache /NFL /NDL /NJH /NJS | Out-Null
          if (-not (Test-Path "$P/neuro12-app/app.yaml")) { throw "нет приложения платы" }
          if (-not (Get-ChildItem "$P/apk/*.apk")) { throw "нет APK" }
          Push-Location launcher/app
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w -H windowsgui" -o "../../$C/launcher/neuro12-start.exe" .
          Pop-Location
          Push-Location launcher/installer
          go build -trimpath -ldflags "-s -w" -o "../../$P/install.exe" .
          Pop-Location
          Copy-Item launcher/brain.ico, launcher/THIRD_PARTY_LICENSES.txt "$C/launcher/"
          # --- свой Python ---
          $R = "$C/runtime"
          Invoke-WebRequest https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip -OutFile py.zip
          Expand-Archive py.zip $R
          Set-Content "$R/python312._pth" "python312.zip`r`n.`r`nLib\site-packages`r`n..\server`r`nimport site`r`n" -Encoding ascii
          Invoke-WebRequest https://bootstrap.pypa.io/get-pip.py -OutFile get-pip.py
          & "$R/python.exe" get-pip.py --no-warn-script-location
          if ($LASTEXITCODE) { throw "get-pip" }
          # srt (зависимость vosk) — только исходники: сборка без изоляции, setuptools заранее
          & "$R/python.exe" -m pip install --no-warn-script-location --no-cache-dir setuptools wheel
          if ($LASTEXITCODE) { throw "setuptools" }
          & "$R/python.exe" -m pip install --no-warn-script-location --no-cache-dir --no-build-isolation numpy pillow vosk
          if ($LASTEXITCODE) { throw "pip install" }
          & "$R/python.exe" -c "import numpy, PIL, vosk, sys; print('ok', sys.version, numpy.__version__)"
          if ($LASTEXITCODE) { throw "imports" }
          # --- русская модель Vosk (голосовой ввод и уши без скачивания) ---
          Invoke-WebRequest https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip -OutFile vosk.zip
          Expand-Archive vosk.zip vosktmp
          Move-Item vosktmp/vosk-model-small-ru-0.22 "$R/vosk-ru"
          Get-ChildItem $R -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          # --- проверка: облако стартует на своём Python ---
          $env:NEURO_DATA = "$env:RUNNER_TEMP\n12data"; $env:NEURO_PORT = "8099"
          $proc = Start-Process "$R/python.exe" -ArgumentList "server\app.py" -WorkingDirectory $C -PassThru -RedirectStandardOutput smoke.log -RedirectStandardError smoke.err
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep 2
            try { $h = Invoke-RestMethod http://127.0.0.1:8099/api/health -TimeoutSec 5; if ($h) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Content smoke.log -Tail 20; Get-Content smoke.err -Tail 20
          if (-not $ok) { throw "облако не ответило на /api/health" }
          Write-Host "облако на своём Python отвечает: $($h | ConvertTo-Json -Compress)"
          @"
          Мозг-12 $CV — общий архив. Python ставить НЕ нужно.

          neuro12-cloud\  облако со своим Python 3.12 (numpy, Pillow, Vosk и русская модель речи) и лаунчер
          neuro12-app\    приложение платы Arduino UNO Q (neuro_12)
          apk\            mozgnet для телефона (Android)
          install.exe      установщик облака для Windows

          ПЕРВАЯ УСТАНОВКА: распакуй архив и запусти install.exe — облако встанет в
          %LOCALAPPDATA%\neuro12-cloud, появится ярлык «Мозг-12» и автозапуск.

          ОБНОВЛЕНИЕ: лаунчер → ⚙ → «Установка из ZIP-архива» → выбери этот архив (распаковывать
          не нужно). Облако обновится (data не тронута), приложение платы встанет в лаунчер
          (кнопка ⏻ зальёт его на плату), APK появится у кнопки 📱 сбоку.
          "@ -replace '(?m)^          ', '' | Set-Content "$P/README-Windows.txt" -Encoding utf8
          Compress-Archive -Path "$P/*" -DestinationPath "out/neuro12-all-v$($CV -replace '\.','_').zip" -CompressionLevel Optimal
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/* }

  sketch:
    # Проверка: скетч платы собирается (arduino-cli, ядро arduino:zephyr, UNO Q)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: arduino-cli и ядро UNO Q
        run: |
          mkdir -p $HOME/bin
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=$HOME/bin sh
          echo "$HOME/bin" >> $GITHUB_PATH
          $HOME/bin/arduino-cli core update-index
          $HOME/bin/arduino-cli core install arduino:zephyr
          $HOME/bin/arduino-cli board listall | grep -i "uno q" || true
          $HOME/bin/arduino-cli lib install Arduino_RouterBridge || true
          $HOME/bin/arduino-cli lib install SoftwareWire || true
      - name: Сборка скетча
        run: |
          FQBN=$(arduino-cli board listall | grep -i "uno q" | awk '{print $NF}' | head -1)
          echo "FQBN=$FQBN"
          arduino-cli compile --fqbn "${FQBN:-arduino:zephyr:unoq}" --warnings default board/sketch 2>&1 | tail -60
          test ${PIPESTATUS[0]} -eq 0

  release:
    needs: [apk, pc, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Версии
        run: |
          echo "CV=$(tr -d ' \r\n' < cloud/VERSION)" >> $GITHUB_ENV
          echo "BV=$(grep -oP 'APP_VERSION = "\K[^"]+' board/python/main.py)" >> $GITHUB_ENV
          echo "LV=$(grep -oP 'const VER = "\K[^"]+' launcher/app/main.go)" >> $GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: mozgnet 1.2.${{ github.run_number }} · облако ${{ env.CV }} · плата ${{ env.BV }} · лаунчер ${{ env.LV }}
          make_latest: true
          files: out/*
          body: |
            Всё «Мозг-12» одной сборкой:
            * **mozgnet-….apk** — телефон: облако внутри, скан сети, подключение плат, вращение MAC плат.
            * **neuro12-cloud-v…-update.zip** — облако ${{ env.CV }}: панель → Обновление (или распаковать поверх папки облака, data/ не трогать).
            * **neuro_12-v….zip** — плата ${{ env.BV }}: импорт в Arduino App Lab → Run.
            * **neuro12-all-v….zip** — ОБЩИЙ АРХИВ: папки neuro12-cloud (облако со своим Python 3.12 — ставить Python не нужно), neuro12-app (плата), apk (телефон) и install.exe. Первая установка — install.exe; обновление — лаунчер → ⚙ → «Установка из ZIP-архива».
            * **neuro12-start.exe** — лаунчер ${{ env.LV }} для Windows (положить в …\neuro12-cloud\launcher\).
            * **neuro12-launcher-linux-v….zip** — лаунчер для РЕД ОС и Ubuntu с облаком: `bash install-linux.sh`.
