name: neuro_12
icon: 🧠
description: "Мозг-12 v2.24 (связь с облаком: письма чата обрабатываются фоновыми потоками — опрос inbox и heartbeat не прерываются, плата не выпадает из «свободных мозгов»; письма забираются самой платой, адрес ей для этого не нужен; плата регистрируется с адресом, мысли собираются в текст и пишутся в чат облака «Мысли плат»; ответы на письма облака — из памяти, без шаблонов зон; буквы/слова генератора скрыты: уходят на пин D6, видны только фразы): у нейронов зонной сети есть АКТИВАЦИЯ — их зажигает всё, что сеть слышит (твои сообщения, фразы буквогенератора, спайки 12 аппаратных нейронов, буквы, вердикты наставника), плюс спонтанный шум; активация затухает со временем. Текстовый генератор СЛУШАЕТ НЕЙРОНЫ: стартовое слово и приоритет продолжений берутся у самых активных нейронов — фраза = то, что сеть «думает» прямо сейчас (в панели видно, кто говорит и какими словами; чип «сеть» показывает горячих нейронов). Основа v2.16: мост живёт постоянно (очередь Bridge.call, живость по любому пакету, пинг), мозг сам генерирует фразы словами из словаря (сеть знаний из памяти/файлов/наставника), буквы фраз скрытно уходят на пин D6 (только текстовый буфер платы), речь через облако в скетч (D8), команда «мысль <тема>». LLM нигде не пишет в чатах — только наставляет (цели, вердикты, советы, «НЕЙРОНЫ: N»); v2.24: кодовый генератор работает ОТ МОЗГА (заготовки + локальная проверка + песочница облака), LLM код не пишет; локальное облако-«кирпич» убрано — снова внешний сервер. Зонная сеть адаптивная (6..48 нейронов), мозг отвечает сам и длинно, устройства — единый мозг (мозг-почта), кнопка 📎: фото/PDF/TXT/Excel/презентации. Импортируется из zip, запускается кнопкой Run."

# ЕДИНСТВЕННЫЙ кирпич — web_ui (веб-интерфейс на порту 7000).
#
# Кирпич arduino:llm НЕ подключён: в установленной версии App Lab такого
# кирпича нет, и приложение не запускалось вовсе. Нейросеть (LLM-молчун:
# учит мозг, в чат не пишет) работает ЧЕРЕЗ ОБЛАКО: POST {cloud_url}/api/llm/ask
# с заголовком X-Mozg-Token, либо через прямой OpenAI-совместимый URL ядра.
# Адрес облака и токен задаются в веб-интерфейсе (панель «⚙ Настройки»).
#
# Речь (TTS) — тоже через облако, как в основном проекте «Мозг-12»:
# POST {cloud_url}/api/tts {"text": "..."} -> WAV (на платформе Silero/
# Piper/espeak). WAV играет динамик платы (aplay), а если звука на плате
# нет — браузер пользователя. Никаких кирпичей для этого не нужно.
# v2.31: зоны Знания / Кирпичики / Любопытство — мозг сам выбирает,
# какую статью прочитать, чтобы ответить; сам собирает приложения
# App Lab из кирпичиков по рецептам из базы примеров кода; ищет в
# интернете по своим мыслям. Скетч реагирует тоном и словом в диктант.
bricks:
  - arduino:web_ui

# v2.32: зона «Математика» — мозг сам пишет формулы (база формул:
# встроенная + синхронизация из облака /api/math/formulas) и строит
# математические модели по данным (линейная/квадратичная/экспоненциальная,
# выбор по R²) с прогнозом. Считает через безопасный AST-вычислитель,
# без LLM. Скетч реагирует тоном 990 Гц и словом в диктант.
