name: neuro_12
icon: 🧠
description: "Star Gate v2.107.0 (слияние с GitHub 2.99.2; нейроны-транслит -> русский, слова вместо молчания, мысли облака): полные мысли — воля мозга отбирает ключевые слова, мозг думает нейронами и текст собирается со всех нейрон-плат (нет связи — zone LLM), в чате с мыслями и в облаке полноценный текст; убраны все питоны (мозг не пишет и не исполняет код Python); русский PCM-голос на PWM D9 (экспериментально); длинные ответы, сводка всех 12 нейронов, честный выбор фразы за максимум 6 свежих контекстов."

# ЕДИНСТВЕННЫЙ кирпич — web_ui (веб-интерфейс на порту 7000).
#
# Кирпич arduino:llm НЕ подключён: в установленной версии App Lab такого
# кирпича нет, и приложение не запускалось вовсе. Нейросеть (LLM-молчун:
# учит мозг, в чат не пишет) работает ЧЕРЕЗ ОБЛАКО: POST {cloud_url}/api/llm/ask
# с заголовком X-Mozg-Token, либо через прямой OpenAI-совместимый URL ядра.
# Адрес облака и токен задаются в веб-интерфейсе (панель «⚙ Настройки»).
#
# Русская речь: локальный eSpeak NG или POST /api/tts/ru облака.
# Выход PCM через Bridge на PWM D9, фильтр и усилитель; TIM16 занят тактом.
# Альтернатива — аудиоустройство Linux/USB. См. UPDATE-2.97-RU.md.
# v2.31: зоны Знания / Кирпичики / Любопытство — мозг сам выбирает,
# какую статью прочитать, чтобы ответить; сам собирает приложения
# App Lab из кирпичиков по рецептам из базы примеров кода; ищет в
# интернете по своим мыслям. Скетч реагирует тоном и словом в диктант.
bricks:
  - arduino:web_ui

# v2.32: зона «Математика» — мозг сам пишет формулы (база формул:
# встроенная + синхронизация из облака /api/math/formulas) и строит
# математические модели по данным (линейная/квадратичная/экспоненциальная,
# выбор по R²) с прогнозом. Считает через безопасный AST-вычислитель,
# без LLM. Скетч реагирует тоном 990 Гц и словом в диктант.
